name: Backend
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cyclescope
          POSTGRES_PASSWORD: cyclescope
          POSTGRES_DB: cyclescope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclescope -d cyclescope_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://cyclescope:cyclescope@localhost:5432/cyclescope_test
      TEST_DATABASE_URL: postgresql+psycopg://cyclescope:cyclescope@localhost:5432/cyclescope_test
      MARKET_DATA_PROVIDER: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=cyclescope --cov-report=term-missing
      - run: uv run alembic check
      - run: uv run python tools/run_mvp_demo.py --verify docs/experiments/synthetic-mvp-week4.json
