[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cyclescope"
version = "0.4.0"
description = "Reproducible market-cycle research infrastructure"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "scipy>=1.15,<2",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
cyclescope = "cyclescope.cli:main"

[dependency-groups]
dev = ["mypy>=1.17,<2", "pandas-stubs>=2.3,<4", "pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "scipy-stubs>=1.15,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cyclescope"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
